# configs/config_v13.yaml
# v12 대비 변경: 3그룹 통합(long-format) 학습을 G1·G3 에만 부분 적용.
version: v13
seed: 42
n_splits: 5                                    # LOYO 에서는 미사용 (연도 수가 폴드 수)

targets: [kpx_group_1, kpx_group_2, kpx_group_3]
capacity_kwh:
  kpx_group_1: 21600
  kpx_group_2: 21600
  kpx_group_3: 21000

data_paths:
  train_dir: ./train
  test_dir: ./test
  save_model_dir: ./saved_models/v13           # ← v12 덮어쓰지 않게
  submission_dir: ./submissions

model_type: XGBoost

# v6 이후 동일. 정제 타깃도 kWh 스케일이라 Tweedie 설정을 그대로 쓴다.
model_params:
  objective: "reg:tweedie"
  tweedie_variance_power: 1.5
  eval_metric: "tweedie-nloglik@1.5"
  tree_method: "hist"
  device: "cuda:0"
  n_estimators: 1000
  learning_rate: 0.03
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 30

early_stopping_rounds: 30

run_args: "--clean-target --top-k 200 --joint-groups kpx_group_1,kpx_group_3"

features_summary: >-
  v6 6대 물리/도메인 피처 + SCADA 가동률 보정 정제 타깃(cf) + 폴드별 top200 가지치기
  + piecewise 단조 후처리 + 3그룹 통합(long-format) 학습을 G1·G3 에만 부분 적용.
  통합 모델 입력에 그룹 one-hot 3 + 정적 스펙 3(제작사·터빈수·로터직경) 추가.

notes: >-
  v13: G3 격차를 구조로 메우는 시도. step4 폴드 점수에서 G1 0.596 / G2 0.606 / G3 0.558 로
  G3 가 혼자 0.05 뒤처져 있었고, 총점이 세 그룹 평균이므로 G3 를 G1 수준까지만 올려도
  총점 +0.016 (v6→v12 로 번 전체의 두 배).
  고칠 수 있는 원인은 라벨 부족뿐(17,538행 vs 26,200행)이며,
  EDA 의 그룹 간 CCF r=0.90~0.95(lag 0)를 근거로 long-format 통합 학습을 시도했다.

  [핵심 발견 — 그룹별 짝비교가 총점 짝비교보다 강력하다]
  통합(B) − 독립(A) 를 그룹별·연도별로 분해하면 부호가 완벽히 일관된다.
    G1  +0.0021 / +0.0072 / +0.0045  -> 평균 +0.0046 (3/3 양수)
    G2  -0.0104 / -0.0023 / -0.0028  -> 평균 -0.0052 (3/3 음수)
    G3   라벨없음 / +0.0101 / +0.0270 -> 평균 +0.0185 (2/2 양수)
  그런데 총점으로 합치면 G2 손실이 G1·G3 이득을 상쇄해 노이즈 판정이 난다.
  borrowed strength 의 표준 패턴이다. 데이터가 적은 쪽(G3)이 이득, 많은 쪽(G2)이 손해.
  따라서 G2 만 독립으로 유지하는 조합(G)을 채택. 이는 사후 선택이 아니라
  '라벨이 33% 적은 그룹만 borrowing 이득을 본다' 는 사전 예측 가능한 방향이다.

  [조건별 raw OOF]
    A 독립       G1 0.5962 / G2 0.6064 / G3 0.5578 -> 평균 0.5868
    B 전체통합    G1 0.6009 / G2 0.6011 / G3 0.5762 -> 평균 0.5927
    C 통합+균형   G1 0.5999 / G2 0.5974 / G3 0.5724 -> 평균 0.5899
    D G3만통합    G1 0.5962 / G2 0.6064 / G3 0.5762 -> 평균 0.5930
    G 그룹별최적   G1 0.6009 / G2 0.6064 / G3 0.5762 -> 평균 0.5945  <- 채택
  G − A = +0.0058, 연도별 [2022 +0.0011 / 2023 +0.0058 / 2024 +0.0105] 로 3/3 양수 (신호).
  2022 제외 시 +0.0081.

  [경고 — 후처리 흡수율이 91%]
  후처리 후에는 A 0.6146 -> G 0.6154 로 +0.0005 에 그치고 2023년은 -0.0037 로 뒤집힌다.
  G 의 raw NMAE 가 더 좋으니 piecewise 최적화가 NMAE 를 더 깎아 FICR 을 더 가져가는 탓이다
  (1-NMAE 후처리 후 A 0.8605 vs G 0.8586). 목적함수상 국소 최적이지만 결과적으로
  두 조건의 최종 점수가 수렴한다.
  누적 관측: 정제타깃 51% / 배치1 80% / D 84% / G 91% 흡수.
  밴드 프리미엄이 이미 +0.0674 로 1등(+0.0523)을 넘어 후처리는 포화 상태이며,
  캘리브레이션 성격의 개선은 중복되어 흡수된다.
  다만 중첩 후처리 판정은 2년으로 적합해 1년에 적용하는 절차라 검정력이 낮다
  (연도 간 변동 ±0.005). raw 판정(std 0.0047)이 훨씬 정밀하므로
  '나쁘다' 가 아니라 '판별 불가' 로 읽고 LB 로 확인한다.

  [이 제출의 목적 — §3.5 가설 시험]
  3그룹 통합은 G3 에게 없던 데이터를 주는 '정보형 변화' 이므로 전이가 기대된다.
  LB +0.004 이상이면 §3.5(정보형은 전이, 정규화형은 과대평가) 지지.
  LB +0.000 근처면 후처리 포화가 실질 제약이라는 뜻이며, 베이스 모델을 소폭 개선하는
  접근 자체를 재검토해야 한다.

  [부수 수정] is_difference_real 의 0 처리 버그. 차이가 정확히 0 인 연도(예: 그 해
  해당 그룹 라벨이 없어 구조적으로 0)를 '부호 불일치' 로 세어 멀쩡한 개선을 기각하고 있었다.
  D 조건이 이 때문에 오판정됐다. 이제 차이 0 인 연도는 판정에서 제외한다.