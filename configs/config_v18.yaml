# configs/config_v18.yaml
# v13 대비 변경: **학습 표본의 연도 가중 하나만** 추가 (2022:0.5 / 2023:0.75 / 2024:1.0).
# 모델·손실·피처·정제 타깃·통합 구성·후처리 전부 v13 그대로 (§3.5 단일 변경 원칙).
version: v18
seed: 42
n_splits: 5

targets: [kpx_group_1, kpx_group_2, kpx_group_3]
capacity_kwh:
  kpx_group_1: 21600
  kpx_group_2: 21600
  kpx_group_3: 21000

data_paths:
  train_dir: ./train
  test_dir: ./test
  save_model_dir: ./saved_models/v18
  submission_dir: ./submissions

model_type: XGBoost

model_params:
  objective: "reg:tweedie"
  tweedie_variance_power: 1.5
  eval_metric: "tweedie-nloglik@1.5"
  tree_method: "hist"
  device: "cuda:0"
  n_estimators: 1000
  learning_rate: 0.03
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 30

early_stopping_rounds: 30

run_args: >-
  --clean-target --top-k 200 --joint-groups kpx_group_1,kpx_group_3
  --year-weight 2022:0.5,2023:0.75,2024:1.0
  --baseline-oof ./saved_models/v13/oof_preds.csv

features_summary: >-
  v13 구성 전부 동일. 추가된 것은 연도별 학습 표본 가중(2022:0.5/2023:0.75/2024:1.0)뿐.

notes: >-
  v18: 공변량 드리프트 대응 — 학습 표본을 최신 체제 쪽으로 기울임. §3.31 (step31).

  [근거 — step31 측정, 학습 데이터 전용]
  연도쌍 판별 AUC 0.80~0.84 (22-24 원거리쌍 최대 = 누적형 표류).
  상위 이동 피처가 물리적으로 일관됨: 습도 계열 13개(전부 단조 증가, r +8%p/3년),
  U성분 7개(10m~500hPa 전 고도 단조 감소, 10m −24%), 기온(지상 +1.1K) 단조 상승.
  500hPa 까지 같은 방향 = 센서가 아니라 대기 순환의 추세. 2025 는 이 추세의 연장선
  (2024 너머 외삽)일 개연성. 피처 제외로는 못 잡음(30개 제거해도 판별력 불변 — 이동이
  수백 컬럼에 중복). => 남는 합법 대응은 표본 가중.

  [step27(연도가중 후처리 폐기)과의 관계]
  그건 후처리 곡선 적합의 가중이었고 이건 모델 학습 표본의 가중. 층이 다르며
  모델 층에서는 최초 시도임.

  [사전 등록 판정 — §3.30 체제]
  1. LOYO 는 이 변화에 구조적으로 불리함 — val2022/val2023 폴드는 "과거를 예측하는데
     미래를 강조" 하는 역방향. 따라서 raw OOF 총점 소폭 하락은 예상 범위이며 기각 사유가
     아님. 내부에서 보는 것: (a) val2024 폴드(배치와 같은 모양)가 v13 의 val2024 대비
     비열등한가, (b) 총점 하락이 -0.005 를 넘지 않는가. 둘 다 충족 시 LB 후보.
  2. 내부 게이트 통과는 제출의 필요조건일 뿐(§3.30 규칙 1). LB 기대: 드리프트 가설이
     맞으면 +0.002~+0.005, 틀리면 -0.003 내외. 이 제출은 "단조 드리프트가 7연패의
     원인인가" 의 직접 시험을 겸함.
  3. 가중 벡터는 (0.5, 0.75, 1.0) 하나만 시험함 — 격자 탐색 금지 (다중성 §3.6).