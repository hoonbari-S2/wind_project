# configs/config_v15.yaml
# v13 대비 변경: 격자 간 산포·공간 경도 피처 54개 추가 (src/features_grid.py). 그 외 전부 동일.
version: v15
seed: 42
n_splits: 5

targets: [kpx_group_1, kpx_group_2, kpx_group_3]
capacity_kwh:
  kpx_group_1: 21600
  kpx_group_2: 21600
  kpx_group_3: 21000

data_paths:
  train_dir: ./train
  test_dir: ./test
  save_model_dir: ./saved_models/v15          # ← v13 덮어쓰지 않게
  submission_dir: ./submissions

model_type: XGBoost

model_params:
  objective: "reg:tweedie"
  tweedie_variance_power: 1.5
  eval_metric: "tweedie-nloglik@1.5"
  tree_method: "hist"
  device: "cuda:0"
  n_estimators: 1000
  learning_rate: 0.03
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 30

early_stopping_rounds: 30

# ⚠ top-k 는 반드시 200. 250 으로 올리면 산포 효과가 소멸함 (step23b 상호작용 -0.0027, 3/3)
run_args: "--clean-target --top-k 200 --joint-groups kpx_group_1,kpx_group_3 --grid-features"

features_summary: >-
  v13 구성 전부 유지(정제 타깃 + 폴드별 top200 + G1·G3 통합 + piecewise 후처리)에
  격자 간 산포·공간 경도 피처 54개 추가. 기저 12변수(LDAPS 5 + GFS 5 + 격자합성 풍속 2)에
  대해 gstd(격자 간 표준편차) / grange(최대-최소) / gdx·gdy(위경도 최소제곱 공간 경도),
  풍속에는 gcv·ggrad·gstd×mean 추가. 812 -> 866.

notes: >-
  v15: v13 과 **딱 한 가지만 다른** 깨끗한 단일 변경 (§3.5). 격자 산포 피처만 추가함.

  [착상 — 잔차 케이스 분석에서 나옴]
  v13 이후 8연속 기각으로 가설 재고가 바닥나, EDA 이후 처음으로 잔차로 고른 실제 행을 열어봄
  (step20). 손실 지도를 그린 결과 G3 격차가 풍속 축에서 국소화됨 — G3 는 저풍속에서 3그룹 중
  최고(정산 구간 적중 32.3%)이나 8~14 m/s 에서 무너짐(19.1% -> 11.5%). info.xlsx 로 원인을
  가른 결과 기종 차이가 아니었음(비출력 0.2887 vs 0.2891 kW/m², 차이 0.14%). 원인은
  **이질적 단지 구성(원동 4기 + 가덕산 1기)과 1.7배 넓은 공간 범위**였음 (§3.19, §3.20).
  => 공간 대표성을 나타내는 양이 피처에 하나도 없다는 데 생각이 닿음.

  [측정 — step23 2x2 요인 (그룹 독립 구성)]
    A 기준 K200 0.5876 / B +산포 K200 0.5900 / C 기준 K250 0.5909 / D +산포 K250 0.5903
    B − A  raw +0.0023  연도별 [+0.0021 +0.0020 +0.0029]  3/3 양수  표준편차 0.0005 (비율 4.6)
    그룹별  G1 +0.0021 / G2 +0.0013 / **G3 +0.0039**  (3/3 양수)
    => §3.20 의 사전 예측("공간 범위가 가장 넓은 G3 에서 최대")이 적중함.
       점수 자체보다 이 예측 적중이 채택의 핵심 근거임.

  [주효과 오차막대 — step23b]
    격자 산포  +0.0010  std 0.0005  비율 2.17  3/3   ✅ §3.6 규칙 2 통과
    선택 예산  +0.0016  std 0.0020  비율 0.81  3/3   ❌ 미달 (2024 한 해가 만든 값)
    상호작용   -0.0027  std 0.0011  비율 2.46  3/3   ✅ **대체 관계 확인**
  => top-k 250 은 채택하지 않음. K=201~250 에서 복귀하는 개별 격자 컬럼이 산포와 같은 정보를
     담고 있어 함께 쓰면 산포 효과가 -0.0004 로 소멸함. **K 는 200 고정.**

  [주장 정정]
  당초 "트리는 16개 컬럼의 표준편차를 절대 못 만든다" 고 판단했으나 대체 관계가 이를 반증함.
  정확히는 **정확히는 못 만들지만 개별 격자 컬럼이 충분하면 여러 분할로 부분 근사함.**
  이 피처의 가치는 '없는 정보를 준다' 가 아니라
  **'같은 정보를 1개 컬럼으로 압축해 선택 예산을 절약한다'** 임.

  [이 제출의 목적 — §3.5 가설 시험]
  격자 산포는 없던 양을 만드는 **정보형 변화**이므로 전이가 기대됨 (관측 전이율 79%).
  raw OOF +0.0023 x 0.79 = LB +0.0018 예상 -> 0.6433 부근.
  사전 등록 판정:
    > 0.6433          정보형 전이 확인. A-4(격자 가중)·A-5(안정도)로 같은 축 확장
    0.6415 ~ 0.6433   전이는 되나 폭이 작음. 전이율 하향 기록 후 A-4 로 진행
    < 0.6415          그룹 독립에서 측정한 이득이 통합 구성에서 사라짐.
                      -> 통합과 산포가 같은 정보를 담고 있다는 뜻. §3.7 과 함께 재해석

  [주의]
  A~D 는 전부 그룹 독립 구성이었으므로, 통합(G1·G3)을 얹은 이 구성에서 이득이 유지되는지
  학습 로그의 raw OOF 로 먼저 확인할 것. v13 raw OOF 0.5995 대비 +0.002 내외가 나와야 함.